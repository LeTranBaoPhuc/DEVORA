spring:
  config:
    activate:
      on-profile: dev
    import: optional:classpath:application-local.yml
  devtools:
    add-properties: true
  datasource:
    url: jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:devora}
    username: root
    password: ${DATABASE_PASSWORD:123456}
    hikari:
      max-lifetime: 300000
      idle-timeout: 60000
      validation-timeout: 5000
      minimum-idle: 5
      maximum-pool-size: 20
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:/db/migration
    clean-disabled: false
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  mail:
    host: smtp.gmail.com
    port: 587
    username: hotro.devora@gmail.com
    password: "nkdldibobhcpgnf"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    from: hotro.devora@gmail.com

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

springdoc:
