spring:
  config:
    activate:
      on-profile: prod
  devtools:
    add-properties: false
  datasource:
    url: jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:devora}
    username: ${root}
    password: ${123456}
    hikari:
      max-lifetime: 300000
      idle-timeout: 60000
      validation-timeout: 5000
      minimum-idle: 5
      maximum-pool-size: 20
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:/db/migration
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  mail:
    from: ${MAIL_USERNAME}
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false


jwt:
  access-key: ${JWT_ACCESS_KEY}
  refresh-key: ${JWT_REFRESH_KEY}
  reset-password-key: ${JWT_RESET_PASSWORD_KEY}
  access-key-expiration: ${JWT_ACCESS_KEY_EXPIRATION:900000}
  refresh-key-expiration: ${JWT_REFRESH_KEY_EXPIRATION:604800000}
  reset-password-key-expiration: ${JWT_RESET_PASSWORD_KEY_EXPIRATION:300000}

app:
  frontend-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000}

logging:
  level:
    org.hibernate.SQL: WARN
    com.zaxxer.hikari: INFO
